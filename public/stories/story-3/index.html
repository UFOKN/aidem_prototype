<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story 3 (wireframe)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.css">
  <script src="../fade.js"></script>
  <link rel="stylesheet" href="../../map/core.css">
  <link rel="stylesheet" href="../../map/panel.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap">
  <style>
    /* EM interface, version 3: the earlier EM report (story 2) split into an overview
       with cards and one page per section (Figma: Story 3 overview 236:4760,
       Story 3 subpage 236:4822). Pages change in place, without reloads.
       Tokens share names with stories 1 and 2. */
    :root {
      --card-bg: #000000;
      --card-text: #ffffff;
      --button-bg: #ffffff;
      --button-text: #000000;
      --button-secondary-bg: #808080;
      --toolbar-bg: #27313d; /* slate (Figma: Colour options, Slate) */
      --toolbar-text: #ffffff;
      --toolbar-muted-text: rgba(255, 255, 255, 0.7);
      --audience-bg: #ffffff;
      --audience-off-bg: #cfd7e0;
      --audience-text: #000000;
      --accent: #4a5d70;
      --accent-text: #ffffff;
      --card-width: 360px;
      --card-padding: 20px;
      --card-gap: 20px;
      --card-inset: 10px;
      --card-font-family: "Source Serif 4", Georgia, serif;
      --card-font-size: 20px;
      --card-small-font-size: 18px;
      --card-muted-text: #bdbdbd;
      --card-paragraph-gap: 22px;
      --button-font-size: 13px;
      --button-padding-x: 8px;
      --button-padding-y: 8px;
      --button-gap: 6px;
      --toolbar-height: 50px;
      --toolbar-padding-x: 16px;
      --page-width: 1440px;
      --toc-width: 330px;
      --tile-bg: #f5f5f5;
    }
    html, body { margin: 0; height: auto; } /* core.css sets 100% for full-screen maps */
    body { background: #ffffff; color: #000000; font: 16px/1.5 Inter, system-ui, sans-serif; }

    .toolbar {
      position: sticky; top: 0; z-index: 4; box-sizing: border-box;
      height: var(--toolbar-height); padding: 0 var(--toolbar-padding-x);
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: var(--toolbar-bg); color: var(--toolbar-text); font: 14px/1.2 Inter, system-ui, sans-serif;
    }
    .toolbar .title { display: flex; gap: 12px; white-space: nowrap; overflow: hidden; }
    .toolbar .scenario { color: var(--toolbar-muted-text); }
    .toolbar .audience { display: flex; gap: 1px; flex: none; }
    .toolbar .audience button {
      padding: 8px 16px; border: 0; border-radius: 0; background: var(--audience-bg); color: var(--audience-text);
      font: 15px/18px Inter, system-ui, sans-serif; white-space: nowrap; cursor: pointer;
    }
    .toolbar .audience button[aria-pressed="false"] { background: var(--audience-off-bg); opacity: 0.9; }

    header.page { background: #f5f5f5; }
    header.page .wrap { max-width: var(--page-width); box-sizing: border-box; margin: 0 auto; padding: 0 16px; }
    header.page .shared { margin: 0; padding-top: 32px; font-size: 14px; color: #555555; }
    header.page h1 { margin: 0; padding: 8px 0 32px; font-size: 32px; font-weight: 400; line-height: 39px; }

    main { padding-bottom: 200px; }

    /* Overview: the summary, then cards for the sections */
    .overview { padding-top: 24px; }
    .overview hr { margin: 40px 0; border: 0; border-top: 1px solid #dddddd; }
    .overview h2.group { margin: 0 0 24px; font-size: 18px; font-weight: 600; }
    .overview .group + .tiles + h2.group { margin-top: 48px; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 36px; }
    /* Cards: white, with a shadow, the screenshot edge to edge (Figma: Story 3 / Overview, card 1) */
    .tile {
      display: flex; flex-direction: column; min-height: 226px; box-sizing: border-box; overflow: hidden;
      background: #ffffff; border-radius: 4px; box-shadow: 0 4px 18.5px rgba(0, 0, 0, 0.25); color: inherit; text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    a.tile:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3); }
    .tile h3 { margin: 0; padding: 15px 14px 14px; font-size: 18px; font-weight: 600; line-height: 1.15; }
    .tile .thumb { display: block; width: 100%; aspect-ratio: 482 / 280; object-fit: cover; }
    .tile.ask { gap: 20px; padding: 14px; }
    .tile.ask h3 { padding: 0; font-weight: 400; }

    /* "Ask a question" (not connected yet) */
    .ask-box { display: flex; gap: 20px; align-items: flex-start; }
    .ask-box input { flex: 1; min-width: 0; height: 34px; box-sizing: border-box; padding: 0 10px; border: 0; background: #cccccc; font: inherit; }
    .ask-box button { padding: 8px 10px; border: 0; background: #ffffff; font: 12px/1.2 Inter, system-ui, sans-serif; cursor: pointer; }
    .ask-section { margin-top: 80px; padding: 20px; background: var(--tile-bg); }
    .ask-section h3 { margin: 0 0 20px; font-size: 22px; font-weight: 400; }

    /* Subpages: table of contents on the left, the section on the right */
    .subpage { display: grid; grid-template-columns: var(--toc-width) minmax(0, 1fr); gap: 56px; max-width: var(--page-width); box-sizing: border-box; margin: 0 auto; padding: 40px 24px 0 16px; }
    .toc { position: sticky; top: calc(var(--toolbar-height) + 24px); align-self: start; padding: 24px 0 0 14px; font-size: 15px; }
    .toc a { display: block; padding: 4px 9px; color: inherit; text-decoration: none; border-radius: 2px; }
    .toc a:hover { background: #f5f5f5; }
    .toc a[aria-current="page"] { background: #f0f0f0; color: #555555; }
    .toc .head { padding-left: 0; font-weight: 600; }
    .toc .head[aria-current="page"] { padding-left: 9px; }
    .toc .group-gap { height: 28px; }
    .toc .todo { margin-left: 6px; padding: 1px 6px; border-radius: 3px; background: #ffe08a; color: #5c4400; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; vertical-align: 1px; }
    .section h2.page-title { margin: 24px 0 28px; font-size: 24px; font-weight: 600; line-height: 1.2; }
    .pager { display: flex; justify-content: space-between; gap: 24px; margin-top: 120px; }
    .pager a { color: inherit; text-decoration: none; }
    .pager a span { display: block; color: #333333; }
    .pager a strong { display: block; font-weight: 600; }
    .pager a.next { margin-left: auto; text-align: right; }
    .pager a:hover strong { text-decoration: underline; text-underline-offset: 3px; }

    /* Report content */
    section + section { margin-top: 64px; }
    h2 { margin: 0 0 20px; font-size: 24px; font-weight: 600; line-height: 1.2; }
    .section h3.q { margin: 0 0 12px; font-size: 20px; font-weight: 600; line-height: 1.25; }
    h3 { margin: 40px 0 12px; font-size: 18px; font-weight: 600; line-height: 1.3; }
    h4 { margin: 28px 0 8px; font-size: 16px; font-weight: 600; }
    h3 + h4 { margin-top: 16px; }
    .intro { max-width: 680px; margin: 0 0 20px; color: #333333; }
    .lead { margin: 0 0 24px; font-size: 18px; line-height: 27px; }
    .figures { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }
    .figures > div { padding: 12px; background: #f5f5f5; }
    .figures strong { display: block; font-size: 22px; font-weight: 600; line-height: 1.2; }
    .figures span { font-size: 12px; color: #555555; line-height: 1.3; }
    .figure-table table { margin: 0; }
    .figure-table td, .figure-table th { border: 0; padding: 2px 0; }
    .figure-table td { font-size: 15px; }
    .figure-table td:first-child { font-size: 12px; color: #555555; }
    .figure-table td[colspan] { text-align: right; }
    .figures-note { margin: 10px 0 0; font-size: 13px; color: #555555; }
    .figure-table.use th:first-child { color: #555555; font-size: 12px; }
    .figure-table.use tr.total td { padding-top: 4px; border-top: 1px solid #dddddd; font-size: 15px; color: #000000; }
    .figure-table th:not(:first-child), .figure-table td:not(:first-child) { width: 60px; padding-left: 8px; white-space: nowrap; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th { padding: 4px 0; font-size: 12px; font-weight: 400; color: #888888; text-align: left; }
    td { padding: 6px 0; border-top: 1px solid #e3e3e3; vertical-align: top; }
    .num th:not(:first-child), .num td:not(:first-child) { text-align: right; }
    td i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
    tr.total td { font-weight: 600; }
    table.zone-table { max-width: 560px; margin: 16px 0 24px; }
    table.impacts td:nth-child(n+4), table.impacts th:nth-child(n+4) { text-align: right; }
    table.impacts td:not(:last-child), table.impacts th:not(:last-child) { padding-right: 16px; }
    table.impacts .type { display: block; margin-top: 2px; font-size: 13px; color: #777777; }
    /* Rows that open sub-categories (impacts page, buildings by use) */
    table.expandable .expand { width: 20px; margin: 0 4px 0 -4px; padding: 0; border: 0; background: none; color: #555555; font: inherit; line-height: 1; cursor: pointer; vertical-align: 0; }
    table.expandable .expand::before { content: "›"; display: inline-block; font-size: 20px; transition: transform 0.15s ease; }
    table.expandable .expand[aria-expanded="true"]::before { transform: rotate(90deg); }
    table.expandable tr.use td { border-top-color: #f0f0f0; color: #555555; font-size: 15px; }
    table.expandable tr.use td:first-child { padding-left: 40px; }
    table.expandable tr.use[hidden] { display: none; }
    table.impacts th { white-space: normal; vertical-align: bottom; }
    table.compact td, table.compact th { font-size: 14px; }
    table.compact th { white-space: normal; vertical-align: bottom; }

    /* Live maps (MapLibre), with a legend in the corner */
    .live-map { position: relative; height: 420px; margin-top: 8px; background: #e6e6e6; }
    .map-legend .legend-title { margin: 0 0 4px; font-weight: 600; color: #000000; }
    .maplibregl-ctrl-compass { display: none; }
    .map-legend { position: absolute; left: 10px; top: 10px; z-index: 2; max-width: 260px; padding: 8px 10px; background: rgba(255,255,255,0.95); border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.25); font: 12px/1.4 Inter, system-ui, sans-serif; }
    .map-legend .legend { display: flex; flex-wrap: wrap; gap: 2px 8px; color: #555555; }
    .map-legend .legend + .legend { margin-top: 4px; }
    .map-legend .legend span { display: inline-flex; align-items: center; gap: 4px; }
    .map-legend .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin: 0; }
    .map-legend .legend .scale { flex: 0 0 240px; }
    .map-legend .clock { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .map-legend .clock button { width: 28px; height: 24px; border: 1px solid #bbbbbb; border-radius: 4px; background: #ffffff; cursor: pointer; }
    .map-legend .time { width: 220px; margin: 4px 0; }
    /* Clicked facility (impacts map), under the legend */
    .map-legend .facility-panel { position: relative; margin-top: 8px; padding-top: 8px; border-top: 1px solid #e3e3e3; }
    .map-legend .facility-panel[hidden] { display: none; }
    .map-legend .facility-panel .name { margin: 0 20px 0 0; font-size: 13px; font-weight: 600; color: #000000; }
    .map-legend .facility-panel .type { margin: 0 0 6px; color: #777777; }
    .map-legend .facility-panel .close { position: absolute; top: 4px; right: -4px; width: 20px; height: 20px; padding: 0; border: 0; background: none; color: #555555; font-size: 16px; line-height: 1; cursor: pointer; }
    .map-legend .facility-panel table { font-size: 12px; }
    .map-legend .facility-panel td { padding: 3px 0; border-top: 1px solid #eeeeee; color: #000000; }
    .map-legend .facility-panel td:first-child { padding-right: 12px; color: #555555; }
    .map-legend .facility-panel td:last-child { text-align: right; }

    /* Create evacuation plan: upload the county's EAP first (placeholder) */
    .upload { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; height: 200px; margin-top: 8px; background: #f5f5f5; }
    .upload p { margin: 0; font-size: 20px; font-style: italic; }
    .upload button { padding: 8px 12px; border: 0; border-radius: 0; background: #000000; color: #ffffff; font: 14px/1.2 Inter, system-ui, sans-serif; cursor: pointer; }
    /* Create evacuation plan */
    .plan h3.q { margin-bottom: 16px; }
    table.zone-columns { margin-top: 28px; }
    table.zone-columns th { padding-bottom: 8px; color: #000000; font-size: 14px; font-weight: 600; }
    table.zone-columns td { padding: 8px 0; }
    table.zone-columns td:first-child { color: #555555; }
    table.zone-columns th:not(:first-child), table.zone-columns td:not(:first-child) { width: 140px; }
    #notices { scroll-margin-top: calc(var(--toolbar-height) + 24px); }
    .notice-zone { padding: 40px 0; border-top: 1px solid #e3e3e3; }
    .plan h3.q + .notice-zone { border-top: 0; padding-top: 24px; }
    .notice-zone h4 { margin: 0; font-size: 18px; font-weight: 600; }
    .notice-zone h4 i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 10px; }
    .notice-zone .when { margin: 4px 0 16px; color: #555555; font-size: 15px; }
    .notices { display: flex; flex-direction: column; gap: 12px; }
    .notices:not(:empty) { margin-bottom: 12px; }
    /* Notice colours by kind: evacuation orders red, notifications orange */
    .notice { --notice-bg: #f5f5f5; --notice-line: #bbbbbb; padding: 16px; border-top: 4px solid var(--notice-line); background: var(--notice-bg); box-shadow: 0 4px 4px rgba(0, 0, 0, 0.25); }
    .notice.order { --notice-bg: #ffefe9; --notice-line: #ff2f00; }
    .notice.notification { --notice-bg: #fffde9; --notice-line: #ff9022; }
    .add-notice { padding: 16px; border: 1px dashed #c7c7c7; border-radius: 8px; }
    .notice-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .notice .title { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; }
    .notice .body { margin: 6px 0 0; color: #333333; font-size: 15px; line-height: 22px; }
    .notice.editing .title, .notice.editing .body { outline: 1px solid #0a66ff; outline-offset: 3px; }
    .notice .edit, .new-notice { padding: 6px 12px; border: 1px solid #bbbbbb; border-radius: 0; background: #ffffff; color: #000000; font: 14px/1.2 Inter, system-ui, sans-serif; cursor: pointer; }
    /* Message modal: the five parts of a warning message (USACE EP 1110-2-17,
       chapter 6), each in its own field, and a preview of the whole message
       (Figma: Modal option A: five-part builder) */
    .notice-modal { width: min(1000px, calc(100vw - 32px)); max-height: calc(100vh - 32px); box-sizing: border-box; padding: 24px; border: 0; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); font: 15px/1.4 Inter, system-ui, sans-serif; }
    .notice-modal::backdrop { background: rgba(0, 0, 0, 0.35); }
    .notice-modal form { display: flex; flex-direction: column; gap: 20px; }
    .notice-modal h3 { margin: 0; font-size: 20px; }
    .notice-modal .sub { margin: 4px 0 0; font-size: 13px; color: #555555; }
    .notice-modal .controls { display: flex; flex-wrap: wrap; gap: 16px; }
    .notice-modal .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #555555; }
    .notice-modal select, .notice-modal textarea { box-sizing: border-box; width: 100%; padding: 8px 10px; border: 1px solid #bbbbbb; border-radius: 0; background: #ffffff; color: #000000; font: 15px/1.4 Inter, system-ui, sans-serif; }
    .notice-modal select { min-width: 287px; }
    .notice-modal .segmented { display: flex; gap: 1px; }
    .notice-modal .segmented button { padding: 8px 12px; border: 0; border-radius: 0; background: var(--audience-off-bg); color: var(--audience-text); font: 14px/1.2 Inter, system-ui, sans-serif; cursor: pointer; }
    .notice-modal .segmented button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
    .notice-modal .body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
    .notice-modal .parts { display: flex; flex-direction: column; gap: 14px; }
    .notice-modal .part { display: flex; flex-direction: column; gap: 6px; padding-left: 16px; border-left: 4px solid var(--part); }
    .notice-modal .part .label { display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; }
    .notice-modal .part .label strong { font-size: 14px; font-weight: 600; color: #000000; }
    .notice-modal .part .label span { font-size: 13px; color: #888888; }
    .notice-modal .part textarea { resize: none; overflow: hidden; padding: 10px; line-height: 21px; }
    .notice-modal .part .data { align-self: flex-start; padding: 4px 8px; background: #f5f5f5; font-size: 12px; color: #555555; }
    .notice-modal .preview { position: sticky; top: 0; display: flex; flex-direction: column; gap: 10px; padding: 16px; background: #f5f5f5; }
    .notice-modal .preview .head { font-size: 13px; color: #555555; }
    .notice-modal .preview .text { margin: 0; font-size: 15px; line-height: 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .notice-modal .preview .order { margin: 0; font-size: 12px; line-height: 17px; color: #777777; }
    .notice-modal .preview .count { margin: 0; font-size: 12px; font-weight: 500; color: #2e7d32; }
    .notice-modal .preview .count.warn { color: #b3261e; }
    .notice-modal .actions { display: flex; justify-content: flex-end; gap: 8px; }
    .notice-modal .actions button { padding: 8px 14px; border: 1px solid #bbbbbb; border-radius: 0; background: #ffffff; font: 14px/1.2 Inter, system-ui, sans-serif; cursor: pointer; }
    .notice-modal .actions .save { border-color: #000000; background: #000000; color: #ffffff; }
    @media (max-width: 760px) { .notice-modal .body { grid-template-columns: 1fr; } .notice-modal .preview { position: static; } }

    /* Story card, fixed bottom-left as in stories 1 and 2 */
    .card {
      position: fixed; left: var(--card-inset); bottom: var(--card-inset); z-index: 5;
      width: var(--card-width); box-sizing: border-box; padding: var(--card-padding);
      display: flex; flex-direction: column; gap: var(--card-gap); align-items: flex-start;
      background: var(--card-bg); color: var(--card-text); font: var(--card-font-size)/1.22 var(--card-font-family);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .card p { margin: 0; }
    .card[hidden] { display: none; }
    .card .text { display: flex; flex-direction: column; gap: var(--card-paragraph-gap); }
    .card p.note { font-size: var(--card-small-font-size); color: var(--card-muted-text); }
    .card .start-over[hidden] { display: none; }
    .card nav { display: flex; flex-wrap: wrap; gap: var(--button-gap); }
    .card nav > * { white-space: nowrap; }
    .card button {
      padding: var(--button-padding-y) var(--button-padding-x); border: 0; border-radius: 0;
      background: var(--button-bg); color: var(--button-text); font: var(--button-font-size)/1.2 Inter, system-ui, sans-serif; cursor: pointer;
    }
    .card .prev { background: var(--button-secondary-bg); aspect-ratio: 1; padding-inline: 0; min-width: calc(var(--button-font-size) * 1.2 + 2 * var(--button-padding-y)); text-align: center; box-sizing: border-box; }
    .card .next[hidden] { display: none; }
    .card button.start-over { background: none; color: var(--button-secondary-bg); padding-inline: 4px; }
    .card button.start-over:hover { color: var(--card-text); }

    @media (max-width: 900px) {
      .subpage { grid-template-columns: 1fr; gap: 0; padding: 24px 16px 0; }
      .toc { position: static; padding: 0; }
      .tiles, .figures { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <span class="title"><span>AidEM Flood Tool</span><span class="scenario">&gt; South Fork Dam &gt; Tabletop Exercise: Dam failure</span></span>
    <div class="audience" role="group" aria-label="Audience">
      <button aria-pressed="false" onclick="fadeTo('../story-1/#4')">USACE</button>
      <button aria-pressed="true">Emergency Managers</button>
    </div>
  </header>
  <header class="page"><div class="wrap"><p class="shared">Report shared by USACE today</p><h1>South Fork Dam: Tabletop Exercise: Dam failure</h1></div></header>
  <main></main>
  <div class="card">
    <div class="text"></div>
    <nav>
      <button class="prev" aria-label="Back" title="Back">←</button>
      <button class="next"></button>
      <button class="start-over">Start over</button>
    </nav>
  </div>
  <script type="module">
    import { createMap, hm } from "../../map/core.js";
    import { legend } from "../../map/panel.js";

    // --- Data --------------------------------------------------------------------
    // Figures from the evacuation zones (LifeSim results, summed over the
    // zones) and the cascading impacts (../data/johnstown_cascade).
    const ZONE_COLORS = { 1: "#d7301f", 2: "#fc8d59", 3: "#fdcc8a" };
    const zoneFeatures = (await (await fetch("../../data/evacuation_zones.geojson")).json()).features;
    const zones = zoneFeatures.map((f) => f.properties).sort((a, b) => a.Zone - b.Zone);
    const getJson = (f) => fetch(`../../data/${f}`).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    const [impacts, areas, facilities] = await Promise.all(
      ["cascade_summary.json", "cascade_service_areas.geojson", "cascade_facilities.geojson"].map(getJson));
    const severity = await getJson("cascade_flooded_severity.json"); // people in flooded buildings by flood severity
    const byUse = await getJson("cascade_flooded_use.json"); // flooded buildings by use (homes, businesses, ...)
    const useByTier = await getJson("cascade_use_by_tier.json"); // buildings by use in each first tier (primary, secondary, tertiary)
    const TIER_COLORS = { primary: "#d81b60", secondary: "#f57c00", tertiary: "#43a047" }; // IMPACT_TIERS in map/core.js
    const sum = (k) => zones.reduce((a, p) => a + p[k], 0);
    const n = (v) => Math.round(v).toLocaleString("en-US");

        app.on("time", sync);
        app.on("play", (on) => (play.textContent = on ? "❚❚" : "▶"));
        slider.addEventListener("input", () => { app.pause(); app.setTime(+slider.value); });
        play.addEventListener("click", () => (app.playing ? app.pause() : app.play({ speed: 0.25 })));
        app.setTime(10);
      }
      liveMaps.push({ container: el, app });
    }
    const mapObserver = new IntersectionObserver((entries) => {
      for (const e of entries) if (e.isIntersecting) { mapObserver.unobserve(e.target); makeMap(e.target); }
    }, { rootMargin: "300px" });
    function watchMaps(root) {
      for (const m of liveMaps.filter((m) => !m.container.isConnected)) m.app.map.remove();
      liveMaps.splice(0, liveMaps.length, ...liveMaps.filter((m) => m.container.isConnected));
      for (const el of root.querySelectorAll(".live-map")) mapObserver.observe(el);
    }

    // Notices: "Add notice" and Edit open the message modal (Figma: Modal
    // option A: five-part builder), Edit with the notice filled in.
    // Audiences are the zone's residents, the county and the facilities in the zone.
    const inPolygon = ([x, y], rings) => rings.reduce((inside, ring) => {
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const [xi, yi] = ring[i], [xj, yj] = ring[j];
        if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
      }
      return inside;
    }, false);
    const inZone = (pt, f) => (f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates).some((poly) => inPolygon(pt, poly));
    const zoneFacilities = (z) => {
      const zf = zoneFeatures.find((f) => f.properties.Zone === z);
      const list = (facilities?.features ?? []).filter((f) => zf && inZone(f.geometry.coordinates, zf));
      const groups = {};
      // The source lists some stations twice (EMS and Fire Stations EMS): one entry each.
      const typeOf = {};
      for (const f of list) {
        const name = titleCase(f.properties.name), t = f.properties.type;
        typeOf[name] = t === "Fire Stations EMS" || (typeOf[name] && typeOf[name] !== t) ? "Fire and ambulance" : TYPES[t] ?? UTIL_TYPE[t] ?? t;
      }
      for (const [name, type] of Object.entries(typeOf)) (groups[type] ??= new Set()).add(name);
      return Object.entries(groups).sort(([a], [b]) => a.localeCompare(b)).map(([type, names]) => [type, [...names].sort()]);
    };
    // The five parts of a warning message (USACE EP 1110-2-17, chapter 6), in
    // the order a full message works best; short ones (SMS, WEA) lead with the
    // guidance. Colours as in Figma (Modal option A: five-part builder).
    const PARTS = [
      { key: "source", label: "Source", hint: "Say who the message is from", color: "#4e79a7" },
      { key: "threat", label: "Threat", hint: "The flood and what it will do, in plain words", color: "#e15759" },
      { key: "location", label: "Location", hint: "Streets, landmarks, rivers, town names", color: "#59a14f" },
      { key: "guidance", label: "Guidance and time", hint: "What to do, by when, how, and why it helps", color: "#f28e2b" },
      { key: "expiration", label: "Expiration", hint: "When it ends or the next update comes", color: "#76b7b2" },
    ];
    const LENGTHS = {
      full: { label: "Full message", limit: null, order: ["source", "threat", "location", "guidance", "expiration"],
        note: "Full messages work best in this order: source, threat, location, guidance and time, expiration. Short ones lead with guidance." },
      sms: { label: "SMS (160)", limit: 160, order: ["source", "guidance", "threat", "location", "expiration"],
        note: "Short messages get attention more than action: they work best in this order: source, guidance and time, threat, location, expiration." },
      wea: { label: "WEA (90)", limit: 90, order: ["source", "guidance", "threat", "location", "expiration"],
        note: "Wireless Emergency Alerts have 90 characters: source, guidance and time, threat, location, expiration." },
    };
    const zoneProps = (z) => zones.find((p) => p.Zone === +z);
    // Starting text for a zone's evacuation order, from its LifeSim figures;
    // [brackets] are for the EM to fill in.
    const template = (z) => {
      const p = zoneProps(z);
      return {
        source: "Cambria County Emergency Management Agency.",
        threat: `South Fork Dam is expected to overtop and may fail. Water up to ${p.Depth_uppq} feet deep could reach your area within ${p.Arrv_uppq} hours.`,
        location: z == 1 ? "Zone 1: [streets and landmarks along the river, from the dam to Johnstown]." : `Zone ${z}: [streets and landmarks].`,
        guidance: "Evacuate now and be out by [time]. Go uphill, away from the river, via [route]. Take medication, pets and documents. Do not drive through water.",
        expiration: "This message will be updated by [time], or sooner if things change.",
      };
    };
    // A pre-drafted notice without parts yet: an evacuation order starts from
    // the template, others keep their text as the threat.
    const partsOf = (cardEl, z) => {
      if (cardEl?.dataset.parts) return JSON.parse(cardEl.dataset.parts);
      const t = template(z);
      if (!cardEl || cardEl.classList.contains("order")) return t;
      return { ...t, threat: cardEl.querySelector(".body").textContent, guidance: "[What to do, and by when]" };
    };
    const assemble = (parts, order) => order.map((k) => parts[k].trim()).filter(Boolean).join(" ");
    const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const fit = (ta) => { ta.style.height = "auto"; ta.style.height = `${ta.scrollHeight + 2}px`; };
    const modal = document.createElement("dialog");
    modal.className = "notice-modal";
    document.body.append(modal);
    let editing = null, editingList = null;
    function openNotice({ zone: z, cardEl = null }) {
      editing = cardEl;
      editingList = cardEl ? null : main.querySelector(`.notice-zone[data-zone="${z}"] .notices`);
      const p = zoneProps(z);
      const residents = `Residents of Zone ${z}`;
      const audience = cardEl?.dataset.audience ?? residents;
      const parts = partsOf(cardEl, z);
      const length = cardEl?.dataset.length ?? "full";
      const kind = cardEl ? cardEl.querySelector(".title").textContent : "New notice";
      const opt = (v) => `<option${v === audience ? " selected" : ""}>${esc(v)}</option>`;
      const DATA = {
        threat: `From the analysis: flood arrives in ${p.Arrv_lowq}–${p.Arrv_uppq} h · typical depth ${p.Depth_lowq}–${p.Depth_uppq} ft`,
        location: `${n(p.PAR_Day)} people (day) · ${n(p.PAR_Nght)} (night) · ${n(p.All_Struct)} buildings`,
      };
      modal.innerHTML = `<form method="dialog">
        <div><h3>Draft evacuation message</h3><p class="sub">Zone ${z} · ${esc(kind)} · Evacuate when: ${EVACUATE_WHEN[z]}</p></div>
        <div class="controls">
          <label class="field">Audience
            <select name="audience">${opt(residents)}${opt("County")}
              ${zoneFacilities(+z).map(([type, names]) => `<optgroup label="${type}">${names.map(opt).join("")}</optgroup>`).join("")}
            </select>
          </label>
          <div class="field">Length
            <div class="segmented" role="group" aria-label="Length">${Object.entries(LENGTHS).map(([k, l]) => `<button type="button" data-length="${k}" aria-pressed="${k === length}">${l.label}</button>`).join("")}</div>
          </div>
        </div>
        <div class="body">
          <div class="parts">${PARTS.map((q) => `<label class="part" style="--part:${q.color}">
            <span class="label"><strong>${q.label}</strong><span>${q.hint}</span></span>
            <textarea name="${q.key}" rows="1">${esc(parts[q.key] ?? "")}</textarea>
            ${DATA[q.key] ? `<span class="data">${DATA[q.key]}</span>` : ""}
          </label>`).join("")}</div>
          <div class="preview" aria-live="polite"><span class="head">Preview</span><p class="text"></p><p class="order"></p><p class="count"></p></div>
        </div>
        <div class="actions"><button value="cancel" class="cancel">Cancel</button><button value="save" class="save">Save draft</button></div>
      </form>`;
      modal.dataset.length = length;
      modal.showModal();
      modal.querySelectorAll(".part textarea").forEach(fit);
      updatePreview();
      modal.querySelector(".part textarea").focus();
    }
    function currentParts() {
      return Object.fromEntries(PARTS.map((q) => [q.key, modal.querySelector(`textarea[name="${q.key}"]`).value]));
    }
    function updatePreview() {
      const l = LENGTHS[modal.dataset.length], parts = currentParts();
      const text = assemble(parts, l.order);
      const missing = PARTS.filter((q) => !parts[q.key].trim()).map((q) => q.label.toLowerCase());
      const over = l.limit && text.length > l.limit;
      modal.querySelector(".preview .text").textContent = text;
      modal.querySelector(".preview .order").textContent = l.note;
      const count = modal.querySelector(".preview .count");
      count.textContent = `${l.limit ? `${text.length} / ${l.limit}` : `${text.length}`} characters · ${missing.length ? `missing: ${missing.join(", ")}` : "all five parts"}`;
      count.classList.toggle("warn", !!(over || missing.length));
    }
    modal.addEventListener("input", (e) => { if (e.target.matches(".part textarea")) { fit(e.target); updatePreview(); } });
    modal.addEventListener("click", (e) => {
      const b = e.target.closest(".segmented button");
      if (!b) return;
      modal.dataset.length = b.dataset.length;
      for (const x of modal.querySelectorAll(".segmented button")) x.setAttribute("aria-pressed", x === b);
      updatePreview();
    });
    // On submit rather than on "close", which the browser fires later. The
    // card shows the full message; the parts and length stay with it for editing.
    modal.addEventListener("submit", (e) => {
      if (e.submitter?.value !== "save") return;
      const audience = e.target.audience.value, parts = currentParts();
      const message = assemble(parts, LENGTHS.full.order) || "[Notice text]";
      let card = editing;
      if (!card && editingList) {
        const to = audience === "County" ? "the county" : audience.startsWith("Residents of") ? audience.replace("Residents", "residents") : audience;
        editingList.insertAdjacentHTML("beforeend", noticeCard(`Notice to ${esc(to)}`, ""));
        card = editingList.lastElementChild;
      }
      if (!card) return;
      card.querySelector(".body").textContent = message;
      Object.assign(card.dataset, { audience, parts: JSON.stringify(parts), length: modal.dataset.length });
    });
    main.addEventListener("click", (e) => {
      const expand = e.target.closest(".expand");
      if (expand) {
        const open = expand.getAttribute("aria-expanded") !== "true", tier = expand.closest("tr").dataset.tier;
        expand.setAttribute("aria-expanded", open);
        for (const tr of expand.closest("table").querySelectorAll(`tr.use[data-tier="${tier}"]`)) tr.hidden = !open;
        return;
      }
      const edit = e.target.closest(".notice .edit");
      if (edit) return openNotice({ zone: edit.closest(".notice-zone").dataset.zone, cardEl: edit.closest(".notice") });
      const add = e.target.closest(".new-notice");
      if (add) openNotice({ zone: add.closest(".notice-zone").dataset.zone });
    });

    // --- Story card -------------------------------------------------------------
    // Step 1 is the report (any page but the plan), step 2 the plan page
    // before the EAP upload, step 3 after it. Its Next brings the closing
    // card (step 4, Figma 311:1036), whose
    // "Start over" fades to black and back to the start of story 1.
    const STORY_1 = "../story-1/";
    const card = document.querySelector(".card"), next = card.querySelector(".next"), prev = card.querySelector(".prev");
    const STEPS = [
      { text: ["USACE has great data, but no authority to warn the public.", "Local emergency managers have that authority, but most aren’t trained to interpret flood data and have few resources for flood planning.", "With AidEM, emergency managers get an accessible summary of the potential flood."], next: "Add local context →" },
      { text: ["EMs can add local context, such as their county Emergency Action Plan."], next: "Upload Cambria County EAP →" },
      { text: ["Today, flood warnings often arrive late or are too vague to act on.", "With AidEM, officials draft effective evacuation notices by incorporating actionable data and FEMA best practices."], next: "Next" },
      { text: ["Floods are becoming more frequent and many U.S. dams are aging. ", "AidEM helps agencies prepare the public — with state-of-the-art flood mapping presented in an accessible way for all stakeholders. And with effective evacuation notices that enable residents to act.", { note: "May disasters like the Johnstown Flood never repeat." }], next: "Start over", startOver: false },
    ];
    let closing = false; // the closing card (step 4), until the page changes
    const step = () => (pageId !== "plan" ? 0 : !uploaded ? 1 : closing ? 3 : 2);
    function syncCard() {
      const s = STEPS[step()];
      card.querySelector(".text").innerHTML = s.text.map((t) => (t.note ? `<p class="note">${t.note}</p>` : `<p>${t}</p>`)).join("");
      next.hidden = !s.next;
      next.textContent = s.next ?? "";
      card.querySelector(".start-over").hidden = s.startOver === false;
    }
    const goPage = (id) => (location.hash.slice(1) === id ? render(id) : (location.hash = id));
    next.addEventListener("click", () => {
      if (step() === 0) { uploaded = false; goPage("plan"); }
      else if (step() === 1) { uploaded = true; render("plan"); }
      else if (step() === 2) { closing = true; syncCard(); }
      else fadeTo(STORY_1 + "#1"); // fade.js
    });
    prev.addEventListener("click", () => {
      if (step() === 0) location.href = STORY_1 + "#4";
      else if (step() === 1) goPage("overview");
      else if (step() === 2) { uploaded = false; render("plan"); }
      else { closing = false; syncCard(); }
    });
    card.querySelector(".start-over").addEventListener("click", () => (location.href = STORY_1 + "#1"));

    render(location.hash.slice(1));
  </script>
</body>
</html>
