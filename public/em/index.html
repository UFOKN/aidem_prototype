<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AidEM Flood Tool · Emergency Managers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.css"
    />
    <script src="../fade.js"></script>
    <link rel="stylesheet" href="../map/core.css" />
    <link rel="stylesheet" href="../map/panel.css" />
    <link rel="stylesheet" href="../vendor/basecoat-button.css" />
    <link rel="stylesheet" href="../vendor/basecoat-form.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap"
    />
    <style>
      /* EM interface, version 4: a 50/50 split screen, the live map on the left
       and the report on the right (Figma: Story 4 / Overview 405:234). Each
       heading opens its detail in the right half (Story 4 / Detail 406:1013
       flooding, 406:1060 direct impact). Tokens share names with stories 1-3. */
      :root {
        --card-bg: #000000;
        --card-text: #ffffff;
        --button-bg: #ffffff;
        --button-text: #000000;
        --button-secondary-bg: #808080;
        --toolbar-bg: #27313d;
        --toolbar-text: #ffffff;
        --toolbar-muted-text: rgba(255, 255, 255, 0.7);
        --audience-bg: #ffffff;
        --audience-off-bg: #cfd7e0;
        --audience-text: #000000;
        --accent: #4a5d70;
        --accent-text: #ffffff;
        --card-width: 340px;
        --card-padding: 20px;
        --card-gap: 20px;
        --card-inset: 16px;
        --card-font-family: "Source Serif 4", Georgia, serif;
        --card-font-size: 19px;
        --card-paragraph-gap: 22px;
        --button-font-size: 13px;
        --button-padding-x: 8px;
        --button-padding-y: 8px;
        --button-gap: 6px;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        background: #ffffff;
        color: #000000;
        font:
          16px/1.5 Inter,
          system-ui,
          sans-serif;
      }

      /* Audience toggle at the top of the report (no top bar in story 4).
       On white, the selected side is the dark toolbar colour. */
      .audience {
        flex: none;
        align-self: flex-end; /* Basecoat's button-group is only as wide as its buttons: right-aligned (annotation, Nov 19) */
        width: auto;
        display: flex;
        justify-content: flex-end;
        padding: 16px 16px 0;
        background: #ffffff;
      }
      .content:has(.report.detail) .audience {
        padding-right: 20px;
      }
      .audience .btn {
        --segment-bg: var(--toolbar-bg);
        --segment-text: var(--toolbar-text);
      }

      /* Split: map left, report right, 50px narrower than half (annotation, Nov 19); the report scrolls on its own */
      .split {
        position: relative;
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr calc(50% - 50px);
      }
      /* Product name, floating top-left on the map (as in story 5) */
      .brand {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 3;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        color: #000000;
        font:
          14px/1.2 Inter,
          system-ui,
          sans-serif;
        pointer-events: none;
      }
      #map {
        position: relative;
        min-height: 0;
      }
      .content {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow-x: clip; /* a page swipes in from the side (render) */
      }
      .report {
        flex: 1;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 32px 16px 16px;
        display: flex;
        flex-direction: column;
      }
      .report > * {
        flex-shrink: 0;
      }
      .report > * + * {
        margin-top: 40px;
      }
      /* Question prompt at the end of every page (Figma: Story 4 / Flooding),
       not interactive yet: at the bottom of the screen while the page is
       shorter, after the content when it's longer */
      .report > .ask {
        margin-top: auto;
        padding-top: 90px; /* 40 px gap and 50 px more (annotation) */
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .ask .label {
        padding: 0 16px 0 12px;
        font:
          13px/16px Inter,
          system-ui,
          sans-serif;
        color: #555555;
      }
      .ask .field {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 8px 8px 8px 12px;
        border: 1px solid #d9d9d9;
        border-radius: 8px;
        background: #f5f5f5;
      }
      .ask .field p {
        flex: 1;
        min-height: 24px;
        margin: 0;
        font:
          16px/24px Inter,
          system-ui,
          sans-serif;
        color: #000000;
      }
      /* Typing caret (askTyper) */
      .ask .field p::after {
        content: "";
        display: inline-block;
        width: 1.5px;
        height: 18px;
        margin-left: 1px;
        vertical-align: -3px;
        background: #000000;
        animation: caret 1s steps(1) infinite;
      }
      .ask .field p.typing::after {
        animation: none;
      }
      @keyframes caret {
        50% {
          opacity: 0;
        }
      }
      .ask .send {
        flex: none;
      }
      /* Sending is not part of the demo: greyed out, with a note on hover */
      .ask .send {
        position: relative;
        cursor: not-allowed;
        opacity: 0.6;
      }
      .ask .send:hover::after {
        content: attr(data-tip);
        position: absolute;
        right: 0;
        bottom: calc(100% + 8px);
        z-index: 3;
        padding: 6px 10px;
        background: #222222;
        color: #ffffff;
        font:
          13px/1.3 Inter,
          system-ui,
          sans-serif;
        white-space: nowrap;
        border-radius: 3px;
      }
      .report.detail {
        padding: 20px;
      }

      .report .shared {
        margin: 0;
        font-size: 14px;
        color: #555555;
      }
      .report h1 {
        margin: 0;
        padding: 8px 0;
        font-size: 30px;
        font-weight: 700;
        line-height: 39px;
      }
      .report .lead {
        margin: 20px 0 0;
        font-size: 18px;
        line-height: 27px;
      }
      .report .lead + .lead {
        margin-top: 16px;
      }
      .report .group h2 {
        margin: 0;
        padding: 10px 0;
        font-size: 18px;
        font-weight: 700;
        line-height: 39px;
      }
      /* Overview rows that open a subpage (→) */
      .report .heading {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 16px 0;
        border-bottom: 1px solid #cccccc;
        color: inherit;
        text-decoration: none;
        font-size: 20px;
        line-height: 39px;
      }
      .report .heading .label {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .report .heading .sign {
        width: 26px;
        text-align: center;
        font-size: 40px;
        font-weight: 200;
        line-height: 39px;
      }
      .report .heading .sign svg {
        display: block;
        margin: auto;
      }
      .report .heading.disabled {
        position: relative;
        color: #aaaaaa;
        cursor: not-allowed;
      }
      .report .heading.disabled:hover::after {
        content: attr(data-tip);
        position: absolute;
        left: 0;
        top: calc(100% - 8px);
        z-index: 3;
        padding: 6px 10px;
        background: #222222;
        color: #ffffff;
        font-size: 13px;
        line-height: 1.3;
        white-space: nowrap;
        border-radius: 3px;
      }
      /* Hover: a soft band across the row and a slightly larger arrow (no underline) */
      .report a.heading {
        transition: background 0.15s ease, padding 0.2s ease;
      }
      /* Left-aligned at rest; on hover the row slides in, so the text keeps off the edge of the band */
      .report a.heading:hover {
        padding-inline: 12px;
        background: #f5f5f5;
      }
      /* Subpage header (Figma: Frame 814): the way back above a bold title.
         It stays at the top while the page scrolls. */
      .report .page-head {
        position: sticky;
        top: 0;
        z-index: 3;
        background: #ffffff;
        box-shadow: 0 -20px 0 #ffffff; /* covers the page's top padding above it */
      }
      .report .page-head .back {
        display: flex;
        width: fit-content;
        margin: -2px -6px;
        padding: 2px 6px;
        color: #000000;
        font-size: 16px;
        line-height: 19px;
        text-decoration: none;
        transition: background 0.15s ease;
      }
      .report .page-head .back:hover {
        background: #f5f5f5;
      }
      .report .page-head h1 {
        margin: 0;
        padding: 8px 0;
        font-size: 30px;
        font-weight: 700;
        line-height: 39px;
      }
      .todo {
        padding: 1px 6px;
        border-radius: 3px;
        background: #ffe08a;
        color: #5c4400;
        font-size: 12px;
        font-weight: 600;
        line-height: 13px;
        letter-spacing: 0.02em;
      }

      /* Detail content: the USACE sidebar's sections (../summary.js), sized like
       story 3's tables (16 px rows with dividers, 12 px grey column heads) */
      .facts {
        font:
          16px/1.5 Inter,
          system-ui,
          sans-serif;
      }
      .facts table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      .facts table + table {
        margin-top: 24px;
      }
      .facts table.group {
        margin-top: 24px;
      }
      .facts th {
        padding: 4px 0;
        font-size: 12px;
        font-weight: 400;
        color: #888888;
        text-align: left;
        vertical-align: bottom;
      }
      .facts td {
        padding: 6px 0;
        border-top: 1px solid #e3e3e3;
        vertical-align: top;
      }
      .facts :is(td, th):not(:first-child) {
        text-align: right;
      }
      .facts table.cols :is(th, td):not(:first-child) {
        width: 120px;
      }
      /* Label and zone columns share the width equally */
      .facts table.zone-columns {
        table-layout: fixed;
      }
      .facts table.zone-columns :is(th, td):not(:first-child) {
        text-align: right;
      }
      .facts table.zone-columns tr.actions td {
        padding: 12px 8px;
      }
      /* Subheadings; their zone cells keep the column hover unbroken */
      .facts table.zone-columns tr.subhead td {
        padding: 24px 8px 4px 0;
        border-top: 0;
        font-size: 12px;
        color: #888888;
      }
      .facts table.zone-columns tr.subhead:first-child td,
      .facts table.zone-columns thead + tbody tr.subhead:first-child td {
        padding-top: 8px;
      }
      .facts table.zone-columns th {
        color: #000000;
        font-size: 14px;
        font-weight: 600;
      }
      /* A zone's column selects it on the map, and a zone clicked on the map
       highlights its column */
      .facts table.zone-columns [data-zone] {
        cursor: pointer;
        padding-inline: 8px;
        /* The column shading stops 10 px short of the cell's left edge: an invisible gap between
           the columns, while the row dividers (cell borders) run on through it */
        background-repeat: no-repeat;
        background-position: right top;
        background-size: calc(100% - 10px) 100%;
      }
      .facts table.zone-columns [data-zone].hover {
        background-image: linear-gradient(#f5f5f5, #f5f5f5);
      }
      .facts table.zone-columns [data-zone].selected {
        background-image: linear-gradient(#ebebeb, #ebebeb);
      }
      .facts table.zone-columns th i {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 2px;
        margin-right: 6px;
        vertical-align: -1px;
      }
      .facts .sub td:first-child {
        padding-left: 16px;
      }
      .facts .na {
        color: #888888;
      }
      .facts td i {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 2px;
        margin-right: 8px;
        vertical-align: -1px;
      }
      .facts .expand {
        width: 20px;
        margin: 0 4px 0 -4px;
        padding: 0;
        border: 0;
        background: none;
        color: #555555;
        font: inherit;
        line-height: 1;
        cursor: pointer;
      }
      .facts .expand::before {
        content: "";
        display: inline-block;
        width: 14px;
        height: 14px;
        vertical-align: -2px;
        background: currentColor;
        -webkit-mask: var(--chevron-right) center / contain no-repeat;
        mask: var(--chevron-right) center / contain no-repeat;
        transition: transform 0.15s ease;
      }
      .facts .expand[aria-expanded="true"]::before {
        transform: rotate(90deg);
      }
      .facts tr.use td {
        border-top-color: #f0f0f0;
        color: #555555;
        font-size: 15px;
      }
      .facts tr.use td:first-child {
        padding-left: 40px;
      }
      .facts tr.use[hidden] {
        display: none;
      }
      /* Which facilities are affected? (as on story 3's impacts page) */
      .report h4 {
        margin: 24px 0 8px;
        font-size: 16px;
        font-weight: 600;
      }
      /* Risk overview: who is affected (one bar, one row per tier), when, and lives at risk */
      /* "Show cascades" pill next to Franklin Memorial Medical Center (risk step, as story 5) */
      .cascade-pill {
        padding: 6px 12px;
        border: 0;
        border-radius: 999px;
        background: #ffffff;
        color: #000000;
        cursor: pointer;
        font:
          13px/1.2 Inter,
          system-ui,
          sans-serif;
        white-space: nowrap;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
        animation: pill-bounce 1.6s ease-in-out infinite;
      }
      @keyframes pill-bounce {
        0%,
        100% {
          translate: 0 0;
        }
        50% {
          translate: 4px 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cascade-pill {
          animation: none;
        }
      }
      /* Flooding page: depth, velocity and timeline, each switching the map's layer */
      .flood-layers {
        margin-top: 24px;
        display: grid;
        grid-auto-rows: 1fr; /* all cards the same height */
        gap: 8px;
      }
      /* Each card is tinted like its map layer: dark blue for depth, pink for velocity, light blue for the timeline */
      .btn.flood-layer[data-variant] {
        --tint: 245, 245, 245;
        --tint-a: 0.7;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        gap: 0;
        width: 100%;
        height: auto;
        padding: 12px;
        border-radius: 8px;
        border-color: transparent;
        background-color: rgba(var(--tint), 0.14);
        color: inherit;
        font: inherit;
        font-weight: 400;
        text-align: left;
        white-space: normal;
      }
      .btn.flood-layer[data-flood="depth_max"] {
        --tint: 8, 69, 148;
      }
      .btn.flood-layer[data-flood="velocity_max"] {
        --tint: 247, 104, 161;
      }
      .btn.flood-layer[data-flood="arrival_first"] {
        --tint: 158, 202, 225;
      }
      .btn.flood-layer[data-variant]:hover {
        background-color: rgba(var(--tint), 0.2);
      }
      /* Tinted at rest, no outline; the active card has the stronger tint */
      .btn.flood-layer[data-variant][aria-pressed="true"] {
        border-color: transparent;
        background-color: rgba(var(--tint), 0.3);
        color: inherit;
        cursor: default;
      }
      .flood-layer h3 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .flood-layer p {
        margin: 0;
        font-size: 14px;
        line-height: 20px;
        color: #555555;
      }
      /* Headings inside a subpage keep 40 px above them and none below (annotation); the cards' own h3 and a first heading excepted */
      .report.detail h3:not(.flood-layer h3):not(:first-child) {
        margin-top: 30px;
        margin-bottom: 0;
        padding: 10px 0;
      }
      .risk .bar {
        display: flex;
        margin-top: 10px;
        height: 16px;
        gap: 2px;
        margin: 0 0 12px;
      }
      .risk .bar span {
        display: block;
        height: 100%;
      }
      .risk .tiers {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      .risk .tiers th {
        padding: 4px 0;
        font-size: 12px;
        font-weight: 400;
        color: #888888;
        text-align: left;
      }
      .risk .tiers td {
        padding: 8px 0;
        border-top: 1px solid #e3e3e3;
        vertical-align: top;
      }
      .risk .tiers :is(td, th):nth-child(n + 2) {
        text-align: right;
        width: 120px;
      }
      .risk .tiers.collapse {
        margin-top: 16px;
      }
      .risk .tiers td.none {
        color: #bbbbbb;
      }
      .risk .tiers i {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 2px;
        margin-right: 8px;
        vertical-align: -1px;
      }
      /* Tier rows open into their buildings by use (toggleUses) */
      .risk .tiers tr.opens {
        cursor: pointer;
      }
      .risk .tiers tr.opens:hover td {
        background: #f5f5f5;
      }
      .risk .tiers .expand {
        width: 20px;
        margin: 0 0 0 -4px;
        padding: 0;
        border: 0;
        background: none;
        color: #555555;
        font: inherit;
        line-height: 1;
        cursor: pointer;
      }
      .risk .tiers .expand::before {
        content: "";
        display: inline-block;
        width: 14px;
        height: 14px;
        vertical-align: -2px;
        background: currentColor;
        -webkit-mask: var(--chevron-right) center / contain no-repeat;
        mask: var(--chevron-right) center / contain no-repeat;
        transition: transform 0.15s ease;
      }
      .risk .tiers .expand[aria-expanded="true"]::before {
        transform: rotate(90deg);
      }
      .risk .tiers .how {
        display: block;
        margin: 2px 0 0 20px;
        font-size: 13px;
        color: #777777;
      }
      .risk .tiers tr.opens .how {
        margin-left: 36px;
      }
      .risk .tiers tr.use td {
        padding: 6px 0;
        border-top-color: #f0f0f0;
        color: #555555;
        font-size: 14px;
      }
      .risk .tiers tr.use td:first-child {
        padding-left: 36px;
      }
      .risk .tiers tr.use[hidden] {
        display: none;
      }
      .risk .tiers tr.use .facility-icon {
        width: 11px;
        height: 11px;
        margin-left: 6px;
        color: #888888;
      }
      .risk .when {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .risk .when li:first-child {
        border-top: 0;
      }
      .risk .when li {
        display: grid;
        grid-template-columns: 76px 1fr;
        gap: 12px;
        padding: 8px 0;
        border-top: 1px solid #e3e3e3;
      }
      /* A logical row (a facility and the people it leaves without a service) has 2 px more padding
         above and below it; between a facility and its people line the spacing stays */
      .risk .when li:not(.people) {
        padding-top: 10px;
      }
      .risk .when li.people,
      .risk .when li:not(.people):not(:has(+ li.people)) {
        padding-bottom: 10px;
      }
      .risk .when time {
        font-variant-numeric: tabular-nums;
        font-size: 14px;
        line-height: 24px;
        color: #555555;
      }
      .risk .when i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 6px;
      }
      /* Cascade: a facility that loses a service is indented under the one it
       depends on and joined to it by an elbow arrow (as story 5's graph) */
      .risk .when li {
        position: relative;
        cursor: pointer;
      }
      .risk
        .when
        li:not([aria-selected="true"]):is(
          :hover,
          :hover + li.people,
          :has(+ li.people:hover)
        ) {
        background: #f5f5f5;
      }
      .risk .when li.faded > :is(time, span),
      .risk .when .faded:is(b, svg) {
        opacity: 0.3;
      }
      .risk .when li > :is(time, span),
      .risk .when :is(b, svg) {
        transition: opacity 0.2s;
      }
      .risk .when li[aria-selected="true"] {
        background: #ebebeb;
      }
      /* Bell, right of a selected facility row's first line */
      .risk .when .notify {
        display: none;
        position: absolute;
        right: 8px;
        top: 11px;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: none;
        color: #333333;
        cursor: pointer;
        align-items: center;
        justify-content: center;
      }
      .risk .when .notify:hover {
        background: #d9d9d9;
      }
      .risk .when li[aria-selected="true"] .notify {
        display: flex;
      }
      .risk .when li[aria-selected="true"]:has(.notify) > span {
        padding-right: 40px;
      }
      .risk .when li > span {
        display: flex;
        align-items: flex-start;
      }
      .risk .when i {
        flex: none;
        margin-top: 7px;
        position: relative;
      }
      .risk .when i.ico {
        width: 20px;
        height: 20px;
        margin: 2px 6px 0 -5px;
      } /* centred on the dots' line; 2 px more room around it */
      .risk .when i.ico svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .risk .when li.people {
        border-top-color: transparent;
      } /* reads as part of its facility's row */
      .risk .when li.people > span > span {
        font-size: 14px;
        line-height: 24px;
        color: #666666;
      }
      .risk .when b.g {
        position: absolute;
        border-left: 1.5px solid #b5b5b5;
      }
      .risk .when svg.elbow {
        position: absolute;
        top: -1px;
        overflow: visible;
        fill: none;
        stroke: #b5b5b5;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .risk .note {
        margin: 16px 0 0;
        font-size: 13px;
        line-height: 19px;
        color: #777777;
      }
      .report h3 + h4 {

      /* Story card, bottom-left over the map */

      /* Evacuation notices: notices per zone (from story 3) */

      /* Message modal: the five parts of a warning message (USACE EP 1110-2-17,

      /* Emergency Action plan: upload the county's EAP (placeholder, as story 3) */
      /* The whole dashed box is the button, as Add notice: an upload icon and its label */
      .upload {
        display: flex;

      /* Step heading with a minimize button; minimized, the card is a single

  </head>
  <body>
    <div class="split">
      <div id="map"></div>
      <div class="brand">AidEM Flood Tool</div>
      <div class="content">
        <div class="audience button-group" role="group" aria-label="Audience">
          <button class="btn" data-variant="outline" data-size="sm" aria-pressed="false" onclick="fadeTo('../#5')">
            USACE
          </button>
          <button class="btn" data-variant="outline" data-size="sm" aria-pressed="true">Emergency Managers</button>
        </div>
        <main class="report"></main>
      </div>
    </div>
    <div class="card">
      <div class="head">
        <p class="step"></p>
        <button class="btn minimize" data-variant="ghost" data-size="icon-sm" aria-label="Minimize the guided tour" title="Minimize"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 10h-4v-4" /><path d="M20 4l-6 6" /><path d="M6 14h4v4" /><path d="M10 14l-6 6" /></svg></button>
      </div>
      <div class="text"></div>
      <nav>
        <button class="btn prev" data-variant="secondary" data-size="icon-sm" aria-label="Back" title="Back">←</button>
        <button class="btn next" data-size="sm"></button>
        <button class="btn start-over" data-variant="ghost" data-size="sm">Start over</button>
      </nav>
      <button class="btn restore" data-variant="ghost" data-size="sm" aria-label="Show the guided tour" title="Show the guided tour">
        <span>Guided tour</span><span class="icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4l4 0l0 4" /><path d="M14 10l6 -6" /><path d="M8 20l-4 0l0 -4" /><path d="M4 20l6 -6" /></svg></span>
      </button>
    </div>
    <script type="module">
      import { glyph } from "../map/cascade-graph.js";
      import {
        createMap,
        clock,
        arrivalClock,
        impactClock,
        IMPACT_TIERS,
        BREACH_HOURS,
        ZONES,
        facilityName,
        facilityIconSvg,
        FACILITY_ICONS,
      } from "../map/core.js";
      import { legend, tierItem, createPanel } from "../map/panel.js";
      import { timelineHtml, setPlaying, updateTimeline, watchTimeline } from "../map/timeline.js";
      import { floodTables, toggleUses } from "../summary.js";

      // --- Data (as in story 3): LifeSim per evacuation zone, cascade summary,
      // flooded buildings by severity (../data/johnstown_cascade).
      const getJson = (f) =>
        fetch(`../data/${f}`)
          .then((r) => (r.ok ? r.json() : null))
          .catch(() => null);
      const [zoneData, impacts, useByTier, areas, facilities, facilityLinks] =
        await Promise.all(
          [
            "evacuation_zones.geojson",
            "cascade_summary.json",
            "cascade_use_by_tier.json",
            "cascade_service_areas.geojson",
            "cascade_facilities.geojson",
            "cascade_links.geojson",
          ].map(getJson),
        );
      const zones = (zoneData?.features ?? [])
        .map((f) => f.properties)
        .sort((a, b) => a.Zone - b.Zone);
      // Typical flood arrival per zone (as in story 3)
      const zoneArrival = (await getJson("zone_arrival.json")) ?? {};
      for (const p of zones) p.arrival = zoneArrival[p.Zone];
      const sum = (k) => zones.reduce((a, p) => a + p[k], 0);
      // Every count on the page except facilities (nFac) is rounded by size: to 500 from 10,000, to 50
      // from 1,000, to 10 from 100, to 5 from 10; below 10 it stays exact
      // (15,312 → 15,500; 5,312 → 5,300; 312 → 310; 31 → 30; 3 → 3).
      const roundCount = (v) => {
        const a = Math.abs(v), step = a >= 10000 ? 500 : a >= 1000 ? 50 : a >= 100 ? 10 : a >= 10 ? 5 : 1;
        return Math.round(v / step) * step;
      };
      const n = (v) => roundCount(v).toLocaleString("en-US");
      // Facility counts are never rounded (user, Nov 19): there are few of them and each one matters
      const nFac = (v) => Math.round(v).toLocaleString("en-US");
      const first = (t) => impacts.buildings[t].first_affected;

      // --- Pages: the overview, and one detail per heading (#flooding, ...)
      // Risk overview (draft): direct and indirect impacts on one page. People and
      // buildings come from the cascade analysis, which counts each building once
      // in its first tier, so the tiers add up; life loss is LifeSim's.
      // The timeline's rows (riskHtml) and the one picked, by index
      let riskEvents = [],
        riskRow = null,
        riskLinks = [];
      // The "Show cascades" pill's facility and marker (syncPill)
      const PILL_FACILITY = "FRANKLIN MEMORIAL MEDICAL CENTER";
      let pill = null;
      // Rows the picked row doesn't fade: itself, the facilities it depends on
      // (up the cascade) and those it takes out (down it), each with its people.
      // null: nothing picked.
      function riskKept(i) {
        if (i == null) return null;
        const name = riskEvents[i]?.name,
          keep = new Set(name ? [name] : []);
        const walk = (n, from, to) => {
          for (const l of riskLinks)
            if (l[from] === n && !keep.has(l[to])) {
              keep.add(l[to]);
              walk(l[to], from, to);
            }
        };
        if (name) {
          walk(name, "to", "from");
          walk(name, "from", "to");
        }
        return new Set(
          riskEvents.flatMap((ev, j) =>
            j === i || keep.has(ev.name) || keep.has(ev.of) ? [j] : [],
          ),
        );
      }
      function riskHtml() {
        if (!impacts)
          return `<p class="note">The cascade analysis didn't load.</p>`;
        const tiers = [
          ["primary", 1, ""],
          ["secondary", 2, "Depends on a flooded facility"],
          ["tertiary", 3, "Depends on facility that lost service"],
        ].map(([key, i, how]) => ({
          key,
          i,
          how,
          ...impacts.buildings[key].first_affected,
        }));
        // Facilities (power, hospitals, schools) that flood or lose a service, by tier
        const KINDS = [
          ["energy", "Power"],
          ["hospital", "Hospitals"],
          ["school", "Schools"],
        ];
        const kindOf = (type) =>
          Object.keys(FACILITY_ICONS).find((k) =>
            FACILITY_ICONS[k].types.includes(type),
          );
        const facCell = (tier, kind) => {
          const c = facilityProps.filter(
            (p) =>
              (tier == null || p.tier === tier) &&
              (!kind || kindOf(p.type) === kind),
          ).length;
          return `<td${c ? "" : ` class="none"`}>${c ? nFac(c) : "–"}</td>`;
        };
        const people = tiers.reduce((a, t) => a + t.pop_day, 0);
        const indirect = tiers[1].pop_day + tiers[2].pop_day;
        const swatch = (i) =>
          `background:${IMPACT_TIERS[i].color}${IMPACT_TIERS[i].stroke ? `; box-shadow: inset 0 0 0 1px ${IMPACT_TIERS[i].stroke}` : ""}`;
        // When it happens: overtopping, the breach, and each facility that fails or loses a service
        // A tree as in story 5's cascade graph: under each facility the people in
        // its service area, then the facilities that lose its service
        // (cascade_links: from provider to facility), joined by elbow arrows.
        const links = (facilityLinks?.features ?? []).map((f) => f.properties);
        const event = (p) => ({
          h: BREACH_HOURS + p.impact_h,
          tier: p.tier,
          name: p.name,
          type: p.type,
          text:
            p.tier === 1
              ? `${facilityName(p.name)} floods`
              : `${facilityName(p.name)} loses ${p.services}`,
        });
        const byTime = (a, b) => a.h - b.h;
        const top = [
          { h: 0, text: "Water starts to overtop South Fork Dam" },
          { h: BREACH_HOURS, text: "South Fork Dam fails" },
        ];
        const hasCause = (p) =>
          links.some(
            (l) =>
              l.to === p.name && facilityProps.some((q) => q.name === l.from),
          );
        for (const p of facilityProps)
          if (p.impact_h != null && !hasCause(p)) top.push(event(p));
        const events = [];
        const add = (e, depth, lasts, anc) => {
          const area = e.name && areaOf(e.name);
          const kids = [
            ...(area
              ? [
                  {
                    h: e.h,
                    tier: Math.min(3, e.tier + 1),
                    people: true,
                    of: e.name,
                    text: `${n(area.pop_day)} people lose ${area.service}`,
                  },
                ]
              : []),
            ...facilityProps
              .filter(
                (p) =>
                  p.impact_h != null &&
                  links.some((l) => l.from === e.name && l.to === p.name),
              )
              .map(event)
              .sort(byTime),
          ];
          const self =
            events.push({
              ...e,
              depth,
              lasts,
              anc,

            const k = Math.min(1, (now - t0) / GROW_MS);
            if (app.facility === name) app.setLinkProgress(1 - (1 - k) ** 3);
            if (k < 1) requestAnimationFrame(frame);
            else resolve();
          };
          app.setLinkProgress(0);
          requestAnimationFrame(frame);
        });
      }
      app.on("zone", markZone);
      // A facility picked on the map (or in the timeline): on the risk overview,
      // its timeline row is highlighted and the map shows the flood at that time
      app.on("facility", (name) => {
        syncPill();
        // On the notices page: a new notice to that facility, in its zone
        if (page === "plan" && uploaded && name) {
          app.selectFacility(null);
          notifyFacility(name);
          return;
        }
        if (page !== "risk") return;
        const cur = riskEvents[riskRow];
        if ((cur?.name ?? null) === name) return; // that row is already picked
        if (!name) {
          if (cur?.name) markRiskRow(null);
          return;
        }
        const i = riskEvents.findIndex((ev) => ev.name === name);
        if (i < 0) return;
        markRiskRow(i);
        app.setTime(riskEvents[i].h);
      });

      // "Show cascades" (as story 5): a bouncing pill next to Franklin Memorial
      // Medical Center on the risk overview step while nothing is selected.
      // Clicking it picks the hospital's timeline row.
      function syncPill() {
        const on =
          STEPS[step].page === "risk" &&
          page === "risk" &&
          !app.facility &&
          !!app.facilityInfo(PILL_FACILITY);
        if (!on) {
          pill?.remove();
          return;
        }
        if (!pill) {
          const el = document.createElement("button");
          el.className = "cascade-pill";
          el.textContent = "Show cascades";
          el.addEventListener("click", (e) => {
            e.stopPropagation();
            const i = riskEvents.findIndex((ev) => ev.name === PILL_FACILITY);
            if (i < 0) return;
            markRiskRow(i);
            app.setTime(riskEvents[i].h);
            showFacility(PILL_FACILITY);
          });
          pill = new app.maplibregl.Marker({
            element: el,
            anchor: "left",
            offset: [16, 0],
          }).setLngLat(app.facilityInfo(PILL_FACILITY).lngLat);
        }
        pill.addTo(app.map);
      }
      function syncMap() {
        if (!app) return;
        app.pause();
        app.selectFacility(null);
        app.selectZone(null);
        const zonesShown = (page === "eap" || page === "plan") && uploaded;
        app.setLayer("evac", zonesShown);
        app.setLayer("directImpacts", page !== "flooding" && !zonesShown);
        app.setLayer("indirectImpacts", page === "risk" || page === null);
        // The notices page shows every facility (all inside the zones): clicking one drafts a notice to it
        if (page === "plan" && uploaded)
          for (const id of [
            "cascade-facilities-direct",
            "cascade-facilities-indirect",
          ]) {
            app.setLayer(id, true);
            app.setLayer(`${id}-icon`, true);
          }
        // The flood layer toggle shows on the flooding page and, under the legend, on the EAP and notices maps (annotations, Nov 19)
        const withToggle = page === "flooding" || page === "eap" || page === "plan";
        document.querySelector(".flood-control").hidden = !withToggle;
        document.querySelector(".flood-control").classList.remove("clock-only");
        const legendBox = document.querySelector(".map-legend");
        layerPanel.hidden = page !== null;
        legendBox.hidden =
          page === null ||
          page === "flooding" ||
          ((page === "eap" || page === "plan") && !uploaded);
        if (zonesShown)
          legendBox.innerHTML = `<div class="legend">${legend("zones")}</div>`;
        // Story 5's tier blocks, with each class's explainer (no "Not affected": nothing grey on this map)
        else
          legendBox.innerHTML = `<div class="tier-legend">${[IMPACT_TIERS[1], ...(page === "risk" ? [IMPACT_TIERS[2], IMPACT_TIERS[3]] : [])].map((t) => tierItem(t)).join("")}</div>`;
        if (page === "flooding") {
          app.setFlood(flood);
          app.setTime(app.maxHours);
          syncFloodControl();
          fit(app.zones.features);
        } else if (page === null) {
          app.setFlood("depth_max");
          app.setTime(app.maxHours); // every impact in
          const { bounds, ...cam } = overviewCamera();
          app.map.fitBounds(bounds, { ...cam, duration: 800 });
        } else {
          app.setFlood("arrival_first");
          app.setTime(app.maxHours);
          if (page === "risk") fit(app.impactAreas.features);
          else if (page === "eap" || page === "plan")
            fit(app.zones.features); // the whole flood area, with or without the zones
        }
        if (page === "eap" || page === "plan") {
          flood = "arrival_first";
          syncFloodControl();
          placeToggleBelowLegend();
        }
        syncPill();
      }
      // On the risk overview a picked timeline row sets the map's time: the
      // clock and slider show then, below the legend
      function syncRiskClock() {
        const box = document.querySelector(".flood-control"),
          legendBox = document.querySelector(".map-legend");
        if (!box || page === "flooding") return;
        const on = page === "risk" && riskRow != null;
        box.hidden = !on;
        box.classList.toggle("clock-only", on);
        if (!on) {
          box.style.top = "";
          return;
        }
        for (const el of box.querySelectorAll(":scope > [data-flood]"))
          el.hidden = el.dataset.flood !== "arrival_first";
        box.style.top = `${legendBox.offsetTop + legendBox.offsetHeight + 8}px`;
      }
      // On the EAP and notices pages the toggle sits under the legend, if there is one
      function placeToggleBelowLegend() {
        const box = document.querySelector(".flood-control"),
          legendBox = document.querySelector(".map-legend");
        box.style.top = legendBox.hidden ? "" : `${legendBox.offsetTop + legendBox.offsetHeight + 8}px`;
      }
      function syncFloodControl() {
        const box = document.querySelector(".flood-control");
        if (!box) return;
        for (const b of box.querySelectorAll(".segmented button"))
          b.setAttribute("aria-pressed", b.dataset.flood === flood);
        for (const el of box.querySelectorAll(":scope > [data-flood]"))
          el.hidden = el.dataset.flood !== flood;
        box.style.top = "";
        for (const b of report.querySelectorAll(".flood-layer"))
          b.setAttribute("aria-pressed", b.dataset.flood === flood);
      }
      function wireFloodControl() {
        const box = document.querySelector(".flood-control");
        const slider = box.querySelector(".time");
        slider.max = app.maxHours;
        slider.value = app.maxHours;
        box.querySelector(".clock-time").textContent = clock(app.maxHours);
        updateTimeline(box);
        watchTimeline(box);
        for (const b of box.querySelectorAll(".segmented button"))
          b.addEventListener("click", () => app.setFlood(b.dataset.flood));
        slider.addEventListener("input", () => {
          app.pause();
          app.setTime(+slider.value);
        });
        box.querySelector(".play").addEventListener("click", () => {
          if (app.playing) return app.pause();
          if (app.time >= app.maxHours - 0.01) app.setTime(0);
          app.play({ speed: 0.5 });
        });
        syncFloodControl();
      }

      window.app = app; // for debugging and Figma captures
    </script>
  </body>
</html>
