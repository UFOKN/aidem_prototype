<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AidEM Flood Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="vendor/basecoat-button.css">
  <script src="fade.js"></script>
  <link rel="stylesheet" href="map/core.css">
  <link rel="stylesheet" href="map/panel.css">
  <style>
    /* The USACE journey (story 5 in Figma), at the site root: began as a copy of
       story 1 (since removed) with the sidebar on the right and the layer panel
       (map legend) on the left.
       Story UI tokens. Same names as the "Story UI" variables in Figma
       (AidEM file, frames "Story 1 / Step N"): card/width there is
       --card-width here. Change a value in either place, then sync. */
    :root {
      --card-bg: #000000;
      --card-text: #ffffff;
      --card-muted-text: #bdbdbd;
      --button-bg: #ffffff;
      --button-text: #000000;
      --button-secondary-bg: #808080;
      --toolbar-bg: #27313d; /* slate (Figma: Colour options, Slate) */
      --toolbar-text: #ffffff;
      --toolbar-muted-text: rgba(255, 255, 255, 0.7);
      --audience-bg: #ffffff;
      --audience-off-bg: #cfd7e0;
      --audience-text: #000000;
      --accent: #4a5d70;
      --accent-text: #ffffff;
      /* layer panel flood toggle (panel.css) */
      --segment-bg: var(--accent);
      --segment-text: var(--accent-text);
      --segment-off-bg: var(--audience-off-bg);
      --segment-off-text: var(--audience-text);
      --segment-off-opacity: 1;
      --card-width: 360px;
      --card-padding: 20px;
      --card-gap: 20px;
      --card-inset: 10px;
      --card-paragraph-gap: 22px;
      --card-font-family: "Source Serif 4", Georgia, serif;
      --card-font-size: 19px;
      --card-small-font-size: 17px;
      --button-font-size: 13px;
      --button-padding-x: 8px;
      --button-padding-y: 8px;
      --button-gap: 6px;
      --toolbar-height: 50px;
      --toolbar-padding-x: 16px;
      --sidebar-width: 361px;
      --sidebar-padding: 16px;
    }

    /* Wireframe: black story card bottom-left, as in Figma (AidEM, Section 1). */
    .card {
      position: absolute; left: var(--card-inset); bottom: var(--card-inset); z-index: 3; /* above map controls */
      width: var(--card-width); box-sizing: border-box; padding: var(--card-padding);
      display: flex; flex-direction: column; gap: var(--card-gap); align-items: flex-start;
      background: var(--card-bg); color: var(--card-text);
      font: var(--card-font-size)/1.3 var(--card-font-family);
    }
    .card .content { display: flex; flex-direction: column; gap: var(--card-paragraph-gap); }
    .card img { width: 100%; aspect-ratio: 300 / 221; object-fit: cover; display: block; }
    .card p { margin: 0; }
    .card p.note { font-size: var(--card-small-font-size); color: var(--card-muted-text); }
    /* Image credit, small, right under the image */
    .card p.credit a { color: inherit; text-decoration: inherit; font: inherit; }
    .card p.credit { margin-top: calc(-1 * var(--card-paragraph-gap) + 6px); font: 12px/1.3 Inter, system-ui, sans-serif; color: var(--card-muted-text); }
    .card nav { display: flex; flex-wrap: wrap; gap: var(--button-gap); }
    .card nav > * { white-space: nowrap; }
    /* Buttons: Basecoat's .btn (vendor/basecoat-button.css), in the card's colours. The
       minimize and restore buttons below keep their own styling. */
    .card .btn {
      --color-primary: var(--button-bg); --color-primary-foreground: var(--button-text);
      --color-secondary: var(--button-secondary-bg); --color-secondary-foreground: #ffffff; --secondary: var(--button-secondary-bg);
      --color-muted: rgba(255, 255, 255, 0.14); --color-foreground: var(--card-text); --color-ring: #ffffff;
    }
    .card button[hidden] { display: none; }
    /* Subtle separation from the panels and map */
    .card { box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25); }
    /* When the card's text changes it fades in, so the change is noticed */
    .card .enter { animation: card-enter 0.45s ease-out both; }
    @keyframes card-enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    /* The previous text slides out the top of the card (setCardText in story.js) */
    .card { overflow: hidden; }
    .card .content.leaving { position: absolute; margin: 0; pointer-events: none; animation: card-leave 0.4s ease-in both; }
    @keyframes card-leave { to { opacity: 0; transform: translateY(-60px); } }
    /* The next button pulses gently */
    .card button.next { animation: next-pulse 2.4s ease-in-out infinite; }
    @keyframes next-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    @media (prefers-reduced-motion: reduce) { .card .enter, .card button.next, .cascade-pill { animation: none; } .card .content.leaving { animation-duration: 1ms; } }
    /* "Show cascades" pill next to the power plant (steps 3 and 4) */
    .cascade-pill {
      /* A shadow and hairline outline, drawn around the clipped arrow shape by the wrapper (a clip-path would cut them off) */
      filter: drop-shadow(0 0 0.6px rgba(0, 0, 0, 0.9)) drop-shadow(0 1px 3px rgba(0, 0, 0, 0.45));
      animation: pill-bounce 1.6s ease-in-out infinite;
    }
    .cascade-pill button {
      /* The left edge is an arrow tip pointing at the facility */
      display: block; padding: 6px 12px 6px 22px; border: 0; border-radius: 0 999px 999px 0; background: #ffffff; color: #000000; cursor: pointer;
      clip-path: polygon(12px 0, 100% 0, 100% 100%, 12px 100%, 0 50%);
      font: 13px/1.2 Inter, system-ui, sans-serif; white-space: nowrap;
    }
    @keyframes pill-bounce { 0%, 100% { translate: 0 0; } 50% { translate: 4px 0; } }
    /* Start over: a muted, label-only button (all cards but the first) */
    .card .btn.start-over { color: var(--button-secondary-bg); }

    /* Step heading with a minimize button; minimized, the card is a single
       "Guided tour +" button (Figma: card 436:1607, minimized 436:1600). */
    .card .head { display: flex; align-items: center; gap: 20px; width: 100%; }
    .card .head[hidden] { display: none; } /* no heading or minimize in the first step (Figma comment, Nov 18) */
    .card .head .step { flex: 1; margin: 0; font: 13px/normal Inter, system-ui, sans-serif; color: #808080; text-transform: uppercase; }
    .card button.restore { display: none; }
    .card button.restore span:first-child { font: var(--card-font-size)/1.25 var(--card-font-family); } /* the serif title, not Basecoat's Inter (Nov 19) */
    /* As in the EM interface: icons in the step title's grey, white on hover; the whole header row minimizes */
    .card button.minimize svg, .card button.restore .icon { display: block; color: #808080; }
    .card button.minimize:hover svg, .card button.restore:hover .icon, .card .head:hover button.minimize svg { color: var(--card-text); }
    .card button.restore .icon svg { display: block; }
    .card .head { cursor: pointer; }
    .card.min { width: auto; }
    .card.min > :not(.restore) { display: none; }
    .card.min button.restore { display: flex; }
    /* Calculate cascading impacts, in a facility's details before step 3 */
    .sidebar .calculate { width: 100%; }

    /* No top bar in story 5: the audience toggle sits at the top of the
       sidebar. On white, the selected side is the dark toolbar colour. */
    .sidebar .audience { flex: none; display: flex; justify-content: flex-end; padding: 0 var(--sidebar-padding) var(--sidebar-padding); }
    .sidebar .audience .btn { --segment-bg: var(--toolbar-bg); --segment-text: var(--toolbar-text); }
    body.instant * { transition: none !important; } /* step opened from the URL: tools just there */
    /* Product name, floating top-left on the map in every step */
    .brand {
      position: absolute; top: 10px; left: 10px; z-index: 2; box-sizing: border-box;
      display: flex; align-items: center;
      color: #000000; font: 14px/1.2 Inter, system-ui, sans-serif; pointer-events: none;
    }

    /* Layer panel top right; zoom control moves from top right to the right
       edge of the sidebar. */
    .layer-panel { top: 37px; left: 10px; /* 10 px under the product name */ right: auto; opacity: 0; pointer-events: none; transition: opacity 0.6s; }
    body.tools .layer-panel, .layer-panel.early { opacity: 1; pointer-events: auto; }
    body.tools .maplibregl-ctrl-top-right { top: 10px; right: calc(var(--sidebar-width) + 14px); left: auto; }
    /* Attribution left of the sidebar */
    body.tools .maplibregl-ctrl-bottom-right { right: var(--sidebar-width); }

    /* Sidebar: summary of the scenario, slides in from the right with the
       toolbar. (In story 1 it's on the left, under the story card.) */
    .sidebar {
      position: absolute; top: 0; bottom: 0; right: 0; z-index: 2; box-sizing: border-box; display: flex; flex-direction: column;
      width: var(--sidebar-width); padding: var(--sidebar-padding) 0;
      background: #ffffff; color: #000000; font: 14px/1.25 Inter, system-ui, sans-serif;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25); /* like the legend */
      transform: translateX(100%); transition: transform 0.5s ease;
    }
    body.tools .sidebar { transform: none; }
    /* Vertical scroll only: the full-width section dividers reach into the
       padding on purpose and must not make the sidebar scroll sideways. */
    .sidebar .scroll, .sidebar .detail { box-sizing: border-box; flex: 1; min-height: 0; padding: 0 var(--sidebar-padding); overflow-y: auto; overflow-x: hidden; }
    .sidebar .scroll[hidden] { display: none; }
    /* Facility details, over the summary */
    .sidebar .detail .back { margin: 0 0 16px; padding: 0; border: 0; background: none; font: 14px/1.25 Inter, system-ui, sans-serif; color: #555555; cursor: pointer; }
    .sidebar .detail h2 i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 8px; vertical-align: 1px; }
    .sidebar .detail .type { margin: -10px 0 12px; color: #555555; }
    .sidebar h3 { margin: 20px 0 8px; font-size: 15px; font-weight: 600; }
    .sidebar h2 + h3 { margin-top: 0; }
    .sidebar h3 + .type { margin-top: -4px; }
    .sidebar .detail td:last-child { padding-left: 12px; }
    .sidebar .detail .cascade-graph { display: block; flex: none; margin: 4px 0 8px; overflow: visible; } /* natural size: text never scales */
    .cascade-graph [data-facility] { cursor: pointer; }
    .cascade-graph .cg-band.hover { fill: #f5f5f5; }
    .sidebar .note { margin: 8px 0 0; font-size: 12px; color: #888888; }
    /* Sections split by full-width dividers */
    .sidebar section + section { margin: 16px calc(-1 * var(--sidebar-padding)) 0; padding: 16px var(--sidebar-padding) 0; border-top: 1px solid #cccccc; }
    .sidebar h2 { margin: 0 0 16px; font-size: 20px; font-weight: 600; }
    .sidebar table + table { margin-top: 8px; }
    /* Tables with column heads: label column, then two right-aligned columns */
    .sidebar table.cols th:not(:first-child), .sidebar table.cols td:not(:first-child) { width: 100px; }
    .sidebar td i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
    .sidebar table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .sidebar td, .sidebar th { padding: 2px 0; text-align: right; font-weight: normal; vertical-align: top; }
    .sidebar td:first-child, .sidebar th:first-child { text-align: left; color: #555555; }
    .sidebar thead th { font-size: 12px; color: #888888; }
    .sidebar .na { color: #888888; }
    /* Rows that open sub-rows (buildings by use) */
    .sidebar .expand { width: 14px; margin: 0 4px 0 -2px; padding: 0; border: 0; background: none; color: #555555; font: inherit; line-height: 1; cursor: pointer; }
    .sidebar .expand::before { content: ""; display: inline-block; width: 12px; height: 12px; vertical-align: -1px; background: currentColor; -webkit-mask: var(--chevron-right) center / contain no-repeat; mask: var(--chevron-right) center / contain no-repeat; transition: transform 0.15s ease; }
    .sidebar .expand[aria-expanded="true"]::before { transform: rotate(90deg); }
    .sidebar .expand.after { margin: 0 0 0 4px; }
    .sidebar .nowrap { white-space: nowrap; }
    /* All impacts: row dividers as in story 4 */
    .sidebar .all-impacts td { padding: 7px 0; border-top: 1px solid #e3e3e3; }
    .sidebar .all-impacts tr.use td { padding: 5px 0; border-top-color: #f0f0f0; }
    .sidebar .all-impacts tr.use td:first-child { padding-left: 18px; }
    .sidebar .all-impacts tr.total td { font-weight: 600; color: #000000; }
    /* Tier labels hang past their swatch, so a wrapped line starts under the text */
    .sidebar .all-impacts td:has(> i) { padding-left: 18px; text-indent: -18px; }
    .sidebar .all-impacts td:has(> i) :is(i, .expand) { text-indent: 0; }
    /* Tier rows above their sub rows: black labels; sub rows smaller and grey */
    .sidebar .all-impacts tr:not(.use) td:first-child { color: #000000; }
    .sidebar .all-impacts tr.use td { font-size: 14px; color: #777777; }
    /* Step 2: "+ Calculate cascading impacts" below each table, like an add-row button;
       the rows it brings in fade in */
    .sidebar .all-impacts .add-row { display: block; width: 100%; margin: 0; padding: 7px 0 7px 18px; border: 0; border-top: 1px solid #e3e3e3; background: none; color: #555555; font: 14px/1.2 Inter, system-ui, sans-serif; text-align: left; cursor: pointer; }
    .sidebar .all-impacts .add-row:hover { color: #000000; background: #f5f5f5; }
    /* A slight pulse so the link stands out */
    .sidebar .all-impacts .add-row { animation: add-row-pulse 2.4s ease-in-out infinite; }
    .sidebar .all-impacts .add-row:hover { animation: none; }
    @keyframes add-row-pulse { 0%, 100% { background-color: transparent; color: #555555; } 50% { background-color: #f0f2f5; color: #000000; } }
    @media (prefers-reduced-motion: reduce) { .sidebar .all-impacts .add-row { animation: none; } }
    .sidebar .all-impacts tr.appearing td { animation: row-in 0.4s ease both; }
    @keyframes row-in { from { opacity: 0; } }
    .sidebar .all-impacts .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #dddddd; border-top-color: #555555; border-radius: 50%; animation: calc-spin 0.8s linear infinite; vertical-align: -2px; }
    @keyframes calc-spin { to { transform: rotate(360deg); } }
    .sidebar .all-impacts tr[data-tier]:not(.use) { cursor: pointer; }
    .sidebar .all-impacts tr[data-tier]:not(.use):hover td { background: #f5f5f5; }
    .sidebar .all-impacts tr.use .facility-icon { width: 11px; height: 11px; margin-left: 6px; vertical-align: -1px; color: #888888; } /* after the label, as in story 4 */
    .sidebar .all-impacts tr.total td:first-child { padding-left: 18px; } /* in line with the labels, past the swatch */
    .sidebar tr.use td:first-child { padding-left: 38px; }
    .sidebar tr.use td { color: #555555; }
    .sidebar tr.use[hidden] { display: none; }
    /* Lives at risk: two bars on one scale; labels above the first, below the second */
    .sidebar .lives-bars { min-height: 104px; margin-bottom: 16px; }
    .sidebar .lives-bars .lbl { display: flex; justify-content: space-between; box-sizing: border-box; line-height: 18px; }
    .sidebar .lives-bars .lbl span { color: #555555; }
    .sidebar .lives-bars .lbl b { font-weight: 600; font-variant-numeric: tabular-nums; }
    .sidebar .lives-bars .bar { height: 8px; margin-top: 6px; }
    .sidebar .lives-bars .bar.second { margin: 13px 0 8px; background: #ae4d1d; }
    .sidebar .lives-bars + table.group, .sidebar .lives-bars ~ table.group { margin-top: 0; }
    /* Its own group, set apart from the tables above */
    .sidebar table.group { margin-top: 16px; }
    /* The cascade timeline (hidden for now, SHOW_TIMELINE in story.js) */
    .sidebar .cascade { position: relative; margin: 0; padding: 0; list-style: none; }
    .sidebar .cascade li { position: relative; display: block; padding: 4px 0; cursor: pointer; }
    .sidebar .cascade li:hover { background: #f5f5f5; }
    .sidebar .cascade time { display: block; font-size: 12px; line-height: 16px; color: #777777; font-variant-numeric: tabular-nums; }
    .sidebar .cascade li > span { display: flex; align-items: flex-start; gap: 6px; line-height: 18px; }
    .sidebar .cascade .dot { flex: none; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; }
    .sidebar .cascade small { display: block; font-size: 12px; color: #777777; }
    .sidebar .cascade li.dam { cursor: default; }
    .sidebar .cascade li.dam:hover { background: none; }
    .sidebar .cascade li.dam .dot { visibility: hidden; margin-top: 21px; }
    .sidebar .cascade b { position: absolute; border-left: 1px solid #b5b5b5; }
    .sidebar .cascade svg { position: absolute; top: 0; overflow: visible; fill: none; stroke: #b5b5b5; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }

    /* Scale bar right of the story card; it comes in with the toolbar */
    .maplibregl-ctrl-bottom-left .scale-bar { margin-left: calc(var(--card-width) + var(--card-inset) + 16px); opacity: 0; transition: opacity 0.6s; }
    body.tools .maplibregl-ctrl-bottom-left .scale-bar { opacity: 1; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="brand">AidEM Flood Tool</div>
  <aside class="sidebar">
    <div class="audience button-group" role="group" aria-label="Audience">
      <button class="btn" data-variant="outline" data-size="sm" aria-pressed="true">USACE</button>
      <button class="btn" data-variant="outline" data-size="sm" aria-pressed="false">Emergency Managers</button><!-- goes to the EM interface (em/) -->
    </div>
  </aside>
  <div class="card">
    <div class="head"><p class="step"></p><button class="btn minimize" data-variant="ghost" data-size="icon-sm" aria-label="Minimize the guided tour" title="Minimize"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 10h-4v-4" /><path d="M20 4l-6 6" /><path d="M6 14h4v4" /><path d="M10 14l-6 6" /></svg></button></div>
    <div class="content" aria-live="polite"></div>
    <nav>
      <button class="btn prev" data-variant="secondary" data-size="icon-sm" aria-label="Back" title="Back">←</button>
      <button class="btn next" data-size="sm"></button>
      <button class="btn start-over" data-variant="ghost" data-size="sm">Start over</button>
    </nav>
    <button class="btn restore" data-variant="ghost" data-size="sm" aria-label="Show the guided tour" title="Show the guided tour"><span>Guided tour</span><span class="icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4l4 0l0 4" /><path d="M14 10l6 -6" /><path d="M8 20l-4 0l0 -4" /><path d="M4 20l6 -6" /></svg></span></button>
  </div>
  <script type="module" src="story.js"></script>
</body>
</html>
